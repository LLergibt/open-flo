[package]
name = "flo-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
argon2 = "=0.5.3"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
jsonwebtoken = { version = "=9.3.1", default-features = false }
rand = "0.8"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
