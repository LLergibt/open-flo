version: "3.8"
services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    environment:
      BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: sqlite:///data/flo.db
      JWT_SECRET_FILE: /data/jwt.key
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://127.0.0.1:8088}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://127.0.0.1:8088,http://localhost:8088}
    volumes:
      - flo-data:/data
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - api
    restart: unless-stopped
volumes:
  flo-data:
